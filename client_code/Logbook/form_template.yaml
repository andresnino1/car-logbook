components_by_slot:
  content:
  - layout_properties: {}
    name: logbook_heading
    properties: {icon: 'mi:car_tag', icon_size: 40, text: My Logbook}
    type: form:dep_lin1x4oec0ytd:_Components.Heading
  - components:
    - data_bindings: []
      layout_properties: {grid_position: 'TKPDDH,UWSIIO', row_background: ''}
      name: date_picker_1
      properties: {bold: false, font_size: 20, format: ' %d/%m/%Y', italic: false, pick_time: false, placeholder: Date, underline: false}
      type: DatePicker
    - layout_properties: {full_width_row: false, grid_position: 'AAYWEP,UGYOHT'}
      name: text_box_1
      properties: {appearance: outlined, display_font_size: 20, label: Odometer, label_bold: false, label_color: '#b7b8b8', label_font_size: 20, placeholder: '', type: number}
      type: form:dep_lin1x4oec0ytd:_Components.TextInput.TextBox
    - event_bindings: {show: dropdown_usage_type_show}
      layout_properties: {grid_position: 'IBTPAU,FDKUNS'}
      name: dropdown_usage_type
      properties:
        appearance: outlined
        items: []
        items_bold: false
        items_font_size: 20
        label: ''
        label_font_size: 20
        label_italic: false
        label_underline: false
        role: [dropdowntextsize, dropdownplaceholder]
        selected_font_size: 20
        selected_text_color: ''
        selected_underline: false
        supporting_text_font_size: 20
      type: form:dep_lin1x4oec0ytd:_Components.DropdownMenu
    - components:
      - layout_properties: {grid_position: 'NNVDEU,LUURKZ'}
        name: personal_lable
        properties: {align: right, font_size: 30, icon_size: null, scale: medium, style: body, text: Personal Kmts}
        type: form:dep_lin1x4oec0ytd:_Components.Text
      - layout_properties: {grid_position: 'NNVDEU,WHDPEZ'}
        name: text_box_2
        properties: {appearance: outlined}
        type: form:dep_lin1x4oec0ytd:_Components.TextInput.TextBox
      - layout_properties: {grid_position: 'RHHNNN,WDKRQA'}
        name: work_label
        properties: {align: right, font_size: 30, text: Work Kmts}
        type: form:dep_lin1x4oec0ytd:_Components.Text
      - layout_properties: {grid_position: 'RHHNNN,AELWET'}
        name: text_box_3
        properties: {appearance: outlined}
        type: form:dep_lin1x4oec0ytd:_Components.TextInput.TextBox
      layout_properties: {grid_position: 'VRLNIR,USOMRE'}
      name: column_panel_usage_type
      properties: {col_widths: '{"LUURKZ":30,"WHDPEZ":30}'}
      type: ColumnPanel
    - data_bindings: []
      layout_properties: {grid_position: 'KSGJYS,GIHAQA'}
      name: button_send
      properties:
        align: full
        appearance: filled
        enabled: true
        font_size: 20
        icon: mi:arrow_forward
        icon_size: 26
        role: square-button
        spacing:
          margin: ['8', null, null, null]
          padding: [null, null, null, '24']
        text: Send
        visible: true
      type: form:dep_lin1x4oec0ytd:_Components.Button
    layout_properties: {}
    name: column_panel_main
    properties: {}
    type: ColumnPanel
  navigation:
  - layout_properties: {}
    name: column_panel_2
    properties: {background: 'theme:Primary', visible: true, wrap_on: mobile}
    type: ColumnPanel
  sidesheet:
  - layout_properties: {}
    name: flow_panel_2
    properties: {visible: false}
    type: FlowPanel
is_package: true
layout:
  properties: {background_color: '', navigation_rail_collapse_to: bottom_app_bar, navigation_rail_color: '', navigation_rail_vertical_align: top, show_sidesheet: false, text_color: ''}
  type: form:dep_lin1x4oec0ytd:Layouts.NavigationRailLayout
